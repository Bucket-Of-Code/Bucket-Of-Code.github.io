version: "3.9"
services:
  jekyll:
    image: jekyll/jekyll:pages
    command: >
      jekyll serve
      --host=0.0.0.0
      --watch
      --force_polling
      --drafts
      --unpublished
      --future
      --verbose
      --trace
      --strict_front_matter
      -d /tmp/_site
    ports:
      - 4002:4000
    environment:
      PAGES_REPO_NWO: "doesnot/matter"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    volumes:
      - .:/srv/jekyll
